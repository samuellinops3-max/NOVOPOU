name: Build PS3 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3dev:latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Compilar PKG do PS3
        run: make pkg

      - name: Disponibilizar PKG para download
        uses: actions/upload-artifact@v4
        with:
          name: PipaCombate-PS3
          path: "*.pkg"
